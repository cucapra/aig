[envs.rust]
command = "{{ time -p ../../target/release/aig simulate {filename} inputs/{base}.stim; }} 2> outputs/{base}.rust.time"
out_dir = "../outputs"
output.sim = "-"

[envs.c]
command = "{{ time -p aigsim {filename} inputs/{base}.stim; }} 2> outputs/{base}.c.time | tail -n +2"
out_dir = "../outputs"
output.sim = "-"