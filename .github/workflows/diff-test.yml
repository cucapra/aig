name: Differential testing against C AIGER

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  compare:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Turnt
        run: uv tool install turnt

      - name: Build Rust implementation
        run: cargo build -p raig-cli --bin raig

      - name: Install C AIGER
        run: |
         git clone https://github.com/arminbiere/aiger.git /tmp/aiger
         cd /tmp/aiger
         ./configure.sh && make
         sudo make PREFIX=/usr/local install

      - name: Compare Rust simulations against C AIGER
        # run: turnt --diff -e rust -e c tests/inputs/*.aag
        run: turnt --diff -e outputs tests/inputs/*.aag
